const config = {
  responsive: true,
  scrollZoom: true,
  displaylogo: false,
  modeBarButtonsToRemove: ['lasso2d', 'select2d']
};

function axisStyle(title, range) {
  return {
    title: { text: title, standoff: 10 },
    range: range,
    zeroline: false,
    showline: true,
    linecolor: 'black',
    linewidth: 1.4,
    mirror: false,
    ticks: 'outside',
    gridcolor: '#ebebeb',
    fixedrange: false
  };
}

function baseLayout() {
  return {
    margin: { l: 78, r: 80, t: 28, b: 72 },
    dragmode: 'pan',
    hovermode: 'closest',
    paper_bgcolor: 'white',
    plot_bgcolor: 'white',
    showlegend: false,
    font: { family: 'Arial, Helvetica, sans-serif', size: 13 },
    shapes: []
  };
}

function addAxisLines(layout, xRange, yRange, addXEqualsOne) {
  layout.shapes = [
    { type: 'line', xref: 'x', yref: 'y', x0: 0, x1: 0, y0: yRange[0], y1: yRange[1], line: { color: 'black', width: 2 } },
    { type: 'line', xref: 'x', yref: 'y', x0: xRange[0], x1: xRange[1], y0: 0, y1: 0, line: { color: 'black', width: 2 } }
  ];
  if (addXEqualsOne) {
    layout.shapes.push({ type: 'line', xref: 'x', yref: 'y', x0: 1, x1: 1, y0: yRange[0], y1: yRange[1], line: { color: 'red', width: 2.5, dash: 'dash' } });
  }
}

function enableRightClickPan(divId) {
  const div = document.getElementById(divId);
  div.addEventListener('contextmenu', e => e.preventDefault());
  div.addEventListener('mousedown', e => {
    if (e.button === 2) {
      e.preventDefault();
      Plotly.relayout(div, { dragmode: 'pan' });
    }
  });
}

const varianceLayout = baseLayout();

correlationLayout.xaxis = axisStyle('s', [0, 1]);

covarianceLayout.xaxis = axisStyle('s', [0, 1]);

addAxisLines(covarianceLayout, [0, 1], [0, 1], false);

Plotly.newPlot('variancePlot', [traces[0]], varianceLayout, config).then(() => enableRightClickPan('variancePlot'));
Plotly.newPlot('correlationPlot', [traces[1]], correlationLayout, config).then(() => enableRightClickPan('correlationPlot'));
Plotly.newPlot('covariancePlot', [traces[2]], covarianceLayout, config).then(() => enableRightClickPan('covariancePlot'));
