const COLORS = {
  'true':   '#000000',
  'paper':  '#D7263D',
  'spline': '#2E8B57'
};
const NAMES = {
  'true':   'true mean μ(t)',
  'paper':  'paper method',
  'spline': 'spline method'
};

// Mapping div id -> data key
const PANELS = [
  { div: 'plot_n100_s0',   key: 'n100_s0'   },
  { div: 'plot_n100_s0p5', key: 'n100_s0p5' },
  { div: 'plot_n200_s0',   key: 'n200_s0'   },
  { div: 'plot_n200_s0p5', key: 'n200_s0p5' },
  { div: 'plot_n400_s0',   key: 'n400_s0'   },
  { div: 'plot_n400_s0p5', key: 'n400_s0p5' },
];

// Compute global y range for each row (consistent across sigma columns)
function rowYRange(keys) {
  let lo = Infinity, hi = -Infinity;
  keys.forEach(k => {
    const p = DATA[k];
    ['true','paper','spline'].forEach(c => {
      p[c].y.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; });
    });
  });
  const pad = (hi - lo) * 0.08;
  return [lo - pad, hi + pad];
}
const yRanges = {
  100: rowYRange(['n100_s0','n100_s0p5']),
  200: rowYRange(['n200_s0','n200_s0p5']),
  400: rowYRange(['n400_s0','n400_s0p5']),
};

// Global x range
const xRange = [0, 1.05]; // a bit past 1 so the t=1 dashed line is visible

function buildTraces(panelKey) {
  const p = DATA[panelKey];
  const traces = [];
  // We add ALL three curves; toggling will use visibility.
  ['true','paper','spline'].forEach(c => {
    traces.push({
      x: p[c].x,
      y: p[c].y,
      type: 'scatter',
      mode: 'lines',
      name: NAMES[c],
      line: { color: COLORS[c], width: (c === 'true' ? 2.5 : 1.8) },
      hovertemplate: 't = %{x:.3f}<br>μ̂(t) = %{y:.4f}<extra>' + NAMES[c] + '</extra>',
      meta: { curve: c },
      visible: true,
      showlegend: false
    });
  });
  return traces;
}

function buildLayout(panelKey) {
  const p = DATA[panelKey];
  const yr = yRanges[p.n];
  return {
    margin: { l: 50, r: 14, t: 10, b: 38 },
    paper_bgcolor: '#ffffff',
    plot_bgcolor:  '#ffffff',
    showlegend: false,
    hovermode: 'closest',
    xaxis: {
      title: { text: 't', font: { size: 13 } },
      range: xRange,
      showline: true,
      linecolor: '#bdbdbd',
      linewidth: 1,
      mirror: false,
      zeroline: true,
      zerolinecolor: '#000000',
      zerolinewidth: 1.6,
      gridcolor: '#eeeeee',
      ticks: 'outside',
      tickcolor: '#888',
      automargin: true
    },
    yaxis: {
      title: { text: 'μ̂(t)', font: { size: 13 } },
      range: yr,
      showline: true,
      linecolor: '#bdbdbd',
      linewidth: 1,
      mirror: false,
      zeroline: true,
      zerolinecolor: '#000000',
      zerolinewidth: 1.6,
      gridcolor: '#eeeeee',
      ticks: 'outside',
      tickcolor: '#888',
      automargin: true
    },
    shapes: [
      // dashed red vertical line at t = 1, spans full y of plot
      {
        type: 'line',
        xref: 'x',
        yref: 'paper',
        x0: 1, x1: 1,
        y0: 0, y1: 1,
        line: { color: '#D7263D', width: 1.8, dash: 'dash' },
        layer: 'above'
      }
    ]
  };
}

const config = {
  responsive: true,
  scrollZoom: true,            // wheel zoom
  displaylogo: false,
  modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'],
  doubleClick: 'reset',
  displayModeBar: 'hover'
};

// Render all panels
PANELS.forEach(p => {
  Plotly.newPlot(p.div, buildTraces(p.key), buildLayout(p.key), config);
});

// Right-click drag = pan.
// Plotly's default left-drag is "zoom" in cartesian. We bind right-mouse to a manual pan.
PANELS.forEach(p => {
  const gd = document.getElementById(p.div);
  let panning = false;
  let startX = 0, startY = 0;
  let startXRange = null, startYRange = null;

  // Suppress the native context menu inside the plot
  gd.addEventListener('contextmenu', e => e.preventDefault());

  gd.addEventListener('mousedown', e => {
    if (e.button !== 2) return; // only right button
    e.preventDefault();
    panning = true;
    startX = e.clientX;
    startY = e.clientY;
    const layout = gd.layout;
    startXRange = layout.xaxis.range.slice();
    startYRange = layout.yaxis.range.slice();
  });

  window.addEventListener('mousemove', e => {
    if (!panning) return;
    const dxPx = e.clientX - startX;
    const dyPx = e.clientY - startY;
    const rect = gd.getBoundingClientRect();
    const plotW = rect.width;
    const plotH = rect.height;
    const xSpan = startXRange[1] - startXRange[0];
    const ySpan = startYRange[1] - startYRange[0];
    const dx = -dxPx / plotW * xSpan;
    const dy =  dyPx / plotH * ySpan; // invert because pixel y grows down
    Plotly.relayout(gd, {
      'xaxis.range': [startXRange[0] + dx, startXRange[1] + dx],
      'yaxis.range': [startYRange[0] + dy, startYRange[1] + dy]
    });
  });

  window.addEventListener('mouseup', e => {
    if (e.button === 2) panning = false;
  });
});

// Checkbox-driven visibility
const checkboxes = document.querySelectorAll('.legend-item input[type=checkbox]');
function applyVisibility() {
  const state = {};
  checkboxes.forEach(cb => { state[cb.dataset.curve] = cb.checked; });

  PANELS.forEach(p => {
    const gd = document.getElementById(p.div);
    // Trace visibility (3 traces: true, paper, spline -- in that order)
    const visibility = ['true','paper','spline'].map(c => state[c] ? true : 'legendonly');
    Plotly.restyle(gd, { visible: visibility }, [0,1,2]);

    // Toggle dashed t=1 line via layout.shapes
    const showX1 = state['x1'];
    const newShapes = showX1 ? [{
      type: 'line', xref: 'x', yref: 'paper',
      x0: 1, x1: 1, y0: 0, y1: 1,
      line: { color: '#D7263D', width: 1.8, dash: 'dash' },
      layer: 'above'
    }] : [];
    Plotly.relayout(gd, { shapes: newShapes });
  });
}
checkboxes.forEach(cb => cb.addEventListener('change', applyVisibility));

</script>
